<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style type="text/css">
      body {
        /* TODO: for dark mode, set color in html body to prevent
        flashbang on initial load */
        /* background-color: rgb(20 20 20); */
      }
    </style>
  </head>
  <body>
    <div id="p5-ezd-app">
      <h1>p5ezd</h1>
      <hr/>
      <div id="app-head" class="app-head">
        <div class="head-row">
          <div class="toolbar"></div>
          <div class="title">
            <h2 class="title-text"></h2>
          </div>
        </div>
        <div class="head-row sk-select"></div>
      </div>
      <div id="sketch-main" class="sketch-main"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>

  <template id="sketch-app-tmplt">
    <div class="sk-app">
      <div class="sk-cfg-panel">
        <div class="sk-cfg-title">Sketch config</div>
        <div class="sk-cfg-menu"></div>
      </div>
      <div class="sk-root">
        <div class="sketch"></div>
      </div>
    </div>
  </template>
  <template id="sketch-config-tmplt">
    <div class="sk-cfg-panel">
      <div class="sk-cfg-title"></div>
      <div class="sk-cfg-menu"></div>
    </div>
  </template>
  <template id="sk-cfg-components-tmplt">
    <div class="cfg-input-group"></div>
    <div class="cfg-input btn-input">
      <button class="sk-btn"></button>
      <div class="sk-btn-label"></div>
    </div>
    <div class="cfg-input num-input">
      <div class="number-label"></div>
      <input type="number"/>
    </div>
  </template>
</html>
